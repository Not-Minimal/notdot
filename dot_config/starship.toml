# ==============================================================================
# CONFIGURACIÓN GLOBAL Y RENDIMIENTO
# ==============================================================================
add_newline = true
command_timeout = 1500
# Subido de 30 -> 100ms: evita que directory/package se corten en carpetas grandes
scan_timeout = 100
palette = 'catppuccin'

# ==============================================================================
# ESTRUCTURA DEL PROMPT
# ==============================================================================
# Línea 1 Izquierda: Contexto de Navegación y Control de Versiones
# Línea 1 Derecha (fill): Entornos, Lenguajes y Custom Modules (Spotify, etc.)
# Línea 2: Sudo, Tiempo, y Acción
format = """
$os\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$kubernetes\
$docker_context\
$custom\
$package\
$nodejs\
$python\
$rust\
$dart\
$env_var.NODE_ENV\
$line_break\
$sudo\
$jobs\
$shlvl\
$time\
$character"""

# Información que aparece a la derecha de tu cursor (Métricas de comandos)
right_format = """$cmd_duration$status"""

# ==============================================================================
# PALETA DE COLORES (Catppuccin Mocha)
# ==============================================================================
[palettes.catppuccin]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext0 = '#a6adc8'
surface0 = '#313244'

# ==============================================================================
# MÓDULOS DE NAVEGACIÓN Y SEPARACIÓN
# ==============================================================================
[fill]
symbol = ' '

[directory]
style = "bold italic blue"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "🏠 ~"
read_only = " 🔒"
read_only_style = "red"
format = "[ $path ]($style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Develelopments" = "󰲋 "

[os]
disabled = false
style = "bold text"

[os.symbols]
Macos = "󰀵 "
Linux = "󰌽 "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'
# Solo aparece si estás conectado por SSH a un servidor remoto — evita
# confundir tu prompt local con el de un servidor cuando trabajas remoto.
[hostname]
disabled = false
ssh_only = true
format = "on [🌐 $hostname](bold red) "
trim_at = "."

# ==============================================================================
# CONTROL DE VERSIONES (GIT SUPERVITAMINADO)
# ==============================================================================
[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_commit]
commit_hash_length = 7
style = "bold teal"
tag_symbol = '🔖 '
only_detached = false
tag_disabled = false
format = '[$hash$tag]($style) '

[git_state]
format = '[$state( $progress_current/$progress_total)](bold yellow) '
cherry_pick = '[🍒 PICKING](bold red)'

[git_metrics]
disabled = false
added_style = 'bold green'
deleted_style = 'bold red'
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${count}⇣${count}"
untracked = "🤷 "
stashed = "📦 "
modified = "📝 "
staged = "✅ "
renamed = "🚚 "
deleted = "🗑️ "

# ==============================================================================
# HERRAMIENTAS DE DESARROLLO, CONTENEDORES Y NUBE
# ==============================================================================
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))](bold cyan) '
symbol = '☸ '
contexts = [
  { context_pattern = ".*prod.*", style = "bold red", context_alias = "PROD" },
  { context_pattern = ".*staging.*", style = "bold yellow", context_alias = "STG" },
]

# Único indicador de Docker: nativo, más liviano y solo aparece con
# Dockerfile/docker-compose.yml en el directorio actual (contexto real).
# Se eliminó custom.docker_status para no duplicar el ícono.
[docker_context]
symbol = " "
style = "bold blue"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[package]
symbol = "📦 "
style = "bold green"
format = "is [$symbol$version]($style) "

# ==============================================================================
# IDIOMAS Y FRAMEWORKS
# ==============================================================================
[nodejs]
disabled = false
symbol = ' '
style = 'bold green'
format = 'via [$symbol$version]($style) '

[python]
symbol = ' '
style = 'bold yellow'
format = 'via [$symbol$version( \($virtualenv\))]($style) '

[rust]
symbol = " "
style = "bold peach"
format = "via [$symbol$version]($style) "

# Aparece automáticamente en proyectos Flutter (pubspec.yaml presente)
[dart]
disabled = false
symbol = "🎯 "
style = "bold cyan"
format = "via [$symbol$version]($style) "

# Aparece solo si tienes NODE_ENV seteado en el shell — útil para no
# confundirte de entorno al correr scripts localmente.
[env_var.NODE_ENV]
symbol = "🌎 "
style = "bold red"
format = "[$symbol$env_value]($style) "

# ==============================================================================
# MÉTRICAS, RENDIMIENTO, ESTADO Y TIEMPO
# ==============================================================================
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [⏳ $duration]($style) "

[status]
disabled = false
style = 'bold red'
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
map_symbol = true
recognize_signal_code = true
pipestatus = true

[time]
disabled = false
format = '[$time]($style) '
time_format = '%H:%M'
style = 'bold subtext0'

[sudo]
disabled = false
style = 'bold yellow'
symbol = '⚡ '
format = '[$symbol]($style)'

# Procesos en background (útil con tu fancy-ctrl-z del .zshrc)
[jobs]
disabled = false
symbol = "✦"
style = "bold blue"
number_threshold = 1
format = "[$symbol$number]($style) "

# Solo aparece si tienes 2+ shells anidados (ej. tmux dentro de tmux,
# o un subshell que olvidaste cerrar)
[shlvl]
disabled = false
threshold = 2
symbol = "❯"
style = "bold yellow"
format = "[$symbol$shlvl]($style) "

[character]
success_symbol = "[🚀](bold green) "
error_symbol = "[💥](bold red) "
# Cambia de símbolo cuando zsh-vi-mode entra en modo Normal (vicmd) —
# se detecta automáticamente por el keymap de zle, no requiere config extra.
vicmd_symbol = "[❮](bold yellow)"

# Opcional: uso de RAM en la barra. Deshabilitado por defecto porque agrega
# una llamada al sistema en cada prompt. Actívalo si te sirve el dato.
[memory_usage]
disabled = true
threshold = 70
symbol = "🐏 "
style = "bold dimmed white"
format = "via $symbol[$ram( | $swap)]($style) "

# ==============================================================================
# MÓDULOS PERSONALIZADOS
# ==============================================================================

# 1. Estado de Postgres
# nc con timeout corto explícito (1s) para no arrastrar el prompt si el
# puerto no responde; 2>/dev/null extra por si nc lanza ruido en stderr.
[custom.postgres_status]
command = "echo '🐘'"
when = "nc -z -w 1 127.0.0.1 5432 >/dev/null 2>&1"
style = "bold cyan"
format = "[$output]($style) "

# 2. Spotify Track (Versión Directa para macOS Apple Silicon)
[custom.spotify]
command = """
osascript -e '
tell application "Spotify"
  if player state is playing then
    set t to artist of current track & " - " & name of current track
    if length of t > 35 then
      set t to text 1 thru 32 of t & "..."
    end if
    return t
  end if
end tell'
"""
when = "pgrep -x Spotify >/dev/null"
style = "bold fg:#1ED760"
format = " 🎧 [$output]($style)"
