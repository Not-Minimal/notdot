# ~/.tmux.conf
# ==============================================================================
# 1. GENERAL
# ==============================================================================
set -g mouse on
set -g history-limit 10000
set-option -g allow-rename off
setw -g mode-keys vi              # También facilita integración con vim-tmux-navigator
set -g base-index 1               # Empezar a indexar en 1 en vez de 0
set -g set-clipboard on           # Clipboard del sistema
set -s escape-time 0              # Mejora el tiempo de respuesta de combinaciones
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # Necesario para que los hex de Catppuccin se vean correctos

set-option -g status-position bottom

# Recargar config con Ctrl+b r
bind r source-file ~/.tmux.conf \; display "Config recargada ✅"

# ==============================================================================
# 2. PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==============================================================================
# 3. CATPPUCCIN — configurar ANTES de cargar el plugin
# ==============================================================================
set -g @catppuccin_flavor "mocha"              # <- esto es lo que te faltaba
set -g @catppuccin_window_status_style "rounded"

# Cargar Catppuccin (instalación manual, no vía TPM)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# --- Construir la barra DESPUÉS de cargar el plugin -----------------------
# catppuccin.tmux ya NO arma status-left/status-right automáticamente en v2:
# hay que ensamblarlo con sus módulos, o se queda con lo último que hayas
# seteado a mano (por eso se veía roto: mantenía tu powerline viejo).
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text "%d-%m-%Y %H:%M"

# ==============================================================================
# 4. PANELES — usando los colores del tema activo (se actualizan solos si
# cambias @catppuccin_flavor, a diferencia de los hex fijos de antes)
# ==============================================================================
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

# ==============================================================================
# 5. INICIALIZAR TPM — SIEMPRE debe ser la última línea del archivo
# ==============================================================================
run '~/.tmux/plugins/tpm/tpm'
